name: Dev - Resolve Latest Image Tags (Weekly)

# Dev is recreated weekly and should reuse whichever image tag was most
# recently pushed for each component, instead of relying on a mutable
# ":latest" tag or a per-build repository_dispatch from each app's CI.

on:
  schedule:
    - cron: "0 12 * * 1" # Monday 12:00 UTC, ahead of the weekly dev recreation
  workflow_dispatch:

jobs:
  resolve-tags:
    runs-on: ubuntu-latest
    steps:

      - name: Obtain a Notify PR Bot GitHub App Installation Access Token
        run: |
          TOKEN="$(npx obtain-github-app-installation-access-token@1.1.0 ci ${{ secrets.PR_BOT_GITHUB_TOKEN }})"
          echo "::add-mask::$TOKEN"
          echo "GITHUB_TOKEN=$TOKEN" >> $GITHUB_ENV

      - name: Checkout
        uses: actions/checkout@ee0669bd1cc54295c223e0bb666b733df41de1c5 # v2.7.0
        with:
          token: ${{ env.GITHUB_TOKEN }}
          ref: main

      - name: Resolve latest pushed image tag for each component
        id: resolve
        run: |
          set -euo pipefail

          # Finds the most recent commit on `main` whose short SHA is an
          # existing tag in the component's public ECR repo, i.e. the
          # newest image that has actually finished building and pushing.
          resolve_tag() {
            local github_repo="$1"
            local ecr_repo="$2"

            local shas
            shas=$(curl -s -H "Authorization: Bearer ${GITHUB_TOKEN}" \
              "https://api.github.com/repos/${github_repo}/commits?sha=main&per_page=30" \
              | jq -r '.[].sha[0:7]')

            local ecr_token
            ecr_token=$(curl -s "https://public.ecr.aws/token/?service=public.ecr.aws&scope=repository:${ecr_repo}:pull" \
              | jq -r '.token')

            local tags
            tags=$(curl -s -H "Authorization: Bearer ${ecr_token}" \
              "https://public.ecr.aws/v2/${ecr_repo}/tags/list" | jq -r '.tags[]')

            local sha
            for sha in $shas; do
              if grep -qx "$sha" <<< "$tags"; then
                echo "$sha"
                return 0
              fi
            done

            echo "::error::No pushed image tag found among the last 30 commits of ${github_repo} (ECR repo ${ecr_repo})" >&2
            return 1
          }

          echo "api_tag=$(resolve_tag cds-snc/notification-api cds-snc/notify-api)" >> "$GITHUB_OUTPUT"
          echo "admin_tag=$(resolve_tag cds-snc/notification-admin cds-snc/notify-admin)" >> "$GITHUB_OUTPUT"
          echo "document_download_tag=$(resolve_tag cds-snc/notification-document-download-api cds-snc/notify-document-download-api)" >> "$GITHUB_OUTPUT"
          echo "documentation_tag=$(resolve_tag cds-snc/notification-documentation cds-snc/notify-documentation)" >> "$GITHUB_OUTPUT"

      - name: Update dev.env with resolved tags
        run: |
          sed -i 's/^API_DOCKER_TAG:.*/API_DOCKER_TAG: "${{ steps.resolve.outputs.api_tag }}"/' helmfile/overrides/dev.env
          sed -i 's/^ADMIN_DOCKER_TAG:.*/ADMIN_DOCKER_TAG: "${{ steps.resolve.outputs.admin_tag }}"/' helmfile/overrides/dev.env
          sed -i 's/^DOCUMENT_DOWNLOAD_DOCKER_TAG:.*/DOCUMENT_DOWNLOAD_DOCKER_TAG: "${{ steps.resolve.outputs.document_download_tag }}"/' helmfile/overrides/dev.env
          sed -i 's/^DOCUMENTATION_DOCKER_TAG:.*/DOCUMENTATION_DOCKER_TAG: "${{ steps.resolve.outputs.documentation_tag }}"/' helmfile/overrides/dev.env
          cat helmfile/overrides/dev.env

      - name: Branch protection OFF
        uses: octokit/request-action@dad4362715b7fb2ddedf9772c8670824af564f0d # v2.4.0
        with:
          route: PUT /repos/:repository/branches/main/protection
          repository: ${{ github.repository }}
          required_status_checks: |
            null
          required_linear_history: |
            null
          enforce_admins: |
            null
          required_pull_request_reviews: |
            null
          restrictions: |
            null
        env:
          GITHUB_TOKEN: ${{ env.GITHUB_TOKEN }}

      - name: Commit
        uses: ./.github/actions/commit-verified
        with:
          github-token: ${{ env.GITHUB_TOKEN }}
          branch: main
          commit-message: "chore: resolve latest dev image tags (api=${{ steps.resolve.outputs.api_tag }}, admin=${{ steps.resolve.outputs.admin_tag }}, document_download=${{ steps.resolve.outputs.document_download_tag }}, documentation=${{ steps.resolve.outputs.documentation_tag }})"
          files: helmfile/overrides/dev.env

      - name: Branch protection ON
        if: always()
        uses: octokit/request-action@dad4362715b7fb2ddedf9772c8670824af564f0d # v2.4.0
        with:
          route: PUT /repos/:repository/branches/main/protection
          repository: ${{ github.repository }}
          required_status_checks: |
            strict: true
            checks:
              - context: helmfile-diff
          required_linear_history: |
            true
          enforce_admins: |
            true
          required_pull_request_reviews: |
            required_approving_review_count: 1
          restrictions: |
            null
        env:
          GITHUB_TOKEN: ${{ env.GITHUB_TOKEN }}

      - name: Notify Slack channel if this job failed
        if: ${{ failure() }}
        run: |
          json='{"text":"<!here> Dev weekly image tag resolution is failing <https://github.com/cds-snc/notification-manifests/|notification-manifests> !"}'
          curl -X POST -H 'Content-type: application/json' --data "$json" ${{ secrets.SLACK_WEBHOOK }}

name: Validate release images

on:
  workflow_call:
    inputs:
      environment:
        description: Deployment environment (staging or production)
        required: true
        type: string
      role-name:
        description: Deployment role used for read-only registry checks
        required: true
        type: string
    secrets:
      AWS_ACCOUNT_ID:
        required: true
      SLACK_WEBHOOK:
        required: true

permissions:
  contents: read
  id-token: write

env:
  NODE_OPTIONS: --use-openssl-ca
  SSL_CERT_FILE: /etc/ssl/certs/ca-certificates.crt
  SSL_CERT_DIR: /etc/ssl/certs
  TARGET_ENVIRONMENT: ${{ inputs.environment }}

jobs:
  validate-images:
    runs-on: ubuntu-latest
    steps:
      - name: Prepare Ubuntu CA trust
        uses: route06/actions/prepare-ubuntu-ca@aa6b218e4bc5445f54d3649a04297af5e1ce7458 # temporary CA mitigation

      - name: Checkout release configuration
        uses: actions/checkout@f43a0e5ff2bd294095638e18286ca9a3d1956744 # v3.6.0

      - name: Configure ECR credentials using OIDC
        uses: aws-actions/configure-aws-credentials@ececac1a45f3b08a01d2dd070d28d111c5fe6722 # v4.1.0
        with:
          role-to-assume: arn:aws:iam::${{ secrets.AWS_ACCOUNT_ID }}:role/${{ inputs.role-name }}
          role-session-name: NotifyReleaseImageValidation
          aws-region: ca-central-1

      - name: Authenticate to public ECR
        run: |
          set -o pipefail
          aws ecr-public get-login-password --region us-east-1 |
            docker login --username AWS --password-stdin public.ecr.aws

      - name: Check configured images exist
        id: validate
        env:
          ACCOUNT_ID: ${{ secrets.AWS_ACCOUNT_ID }}
          AWS_PAGER: ''
        run: |
          config="$(ruby -ryaml -rjson -e 'puts JSON.generate(YAML.safe_load(File.read(ARGV.fetch(0))))' "helmfile/overrides/$TARGET_ENVIRONMENT.env")"
          failures=()
          while read -r component repository region; do
            key="${component}_DOCKER_TAG"
            tag="$(jq -r --arg key "$key" '.[$key] // empty' <<< "$config")"
            if [[ "$region" == public ]]; then
              repository="$(jq -r --arg key "$repository" '.[$key] // empty' <<< "$config")"
              if [[ "$component" == IPV4 ]]; then
                repository="$(ruby -ryaml -e 'puts YAML.safe_load(File.read(ARGV.fetch(0))).fetch("image").fetch("repository")' helmfile/charts/ipv4-geolocate/values.yaml)"
              fi
            else
              repository="$ACCOUNT_ID.dkr.ecr.$region.amazonaws.com/$repository"
            fi
            reason=''
            if [[ -z "$tag" || -z "$repository" ]]; then
              reason='Missing configured image repository or tag.'
            elif [[ "$region" == public ]]; then
              if ! error="$(docker manifest inspect "$repository:$tag" 2>&1)"; then
                reason="Public ECR image missing or inaccessible: ${error:0:400}"
              fi
            elif ! error="$(aws ecr describe-images --region "$region" --registry-id "$ACCOUNT_ID" \
              --repository-name "${repository#*/}" --image-ids "imageTag=$tag" 2>&1)"; then
              reason="Private ECR image missing or inaccessible: ${error:0:400}"
            fi
            if [[ -n "$reason" ]]; then
              failures+=("$key ($repository:$tag): $reason")
            fi
          done <<'IMAGES'
          ADMIN ADMIN_IMAGE_REPOSITORY public
          API API_IMAGE_REPOSITORY public
          DOCUMENT_DOWNLOAD DOCUMENT_DOWNLOAD_IMAGE_REPOSITORY public
          DOCUMENTATION DOCUMENTATION_IMAGE_REPOSITORY public
          IPV4 IPV4_IMAGE_REPOSITORY public
          BLAZER database-tools/blazer ca-central-1
          GOOGLE_CIDR lambda/google-cidr ca-central-1
          HEARTBEAT notify/heartbeat ca-central-1
          PINPOINT_TO_SQS_SMS_CALLBACKS notify/pinpoint_to_sqs_sms_callbacks ca-central-1
          PINPOINT_TO_SQS_SMS_CALLBACKS notify/pinpoint_to_sqs_sms_callbacks us-west-2
          SES_RECEIVING_EMAILS notify/ses_receiving_emails us-east-1
          SES_TO_SQS_EMAIL_CALLBACKS notify/ses_to_sqs_email_callbacks ca-central-1
          SNS_TO_SQS_SMS_CALLBACKS notify/sns_to_sqs_sms_callbacks ca-central-1
          SYSTEM_STATUS notify/system_status ca-central-1
          IMAGES
          if (( ${#failures[@]} )); then
            details="$(printf -- '- %s\n' "${failures[@]}")"
            delimiter="failures-${RANDOM}-${RANDOM}"
            printf 'failures<<%s\n%s\n%s\n' "$delimiter" "$details" "$delimiter" >> "$GITHUB_OUTPUT"
            printf '## %s image validation failed\n%s\n' "$TARGET_ENVIRONMENT" "$details" >> "$GITHUB_STEP_SUMMARY"
            echo "::error::$TARGET_ENVIRONMENT image validation failed. See the job summary for affected images and reasons."
            exit 1
          fi
          echo "All 14 $TARGET_ENVIRONMENT image/region checks passed." >> "$GITHUB_STEP_SUMMARY"

      - name: Notify Slack when image validation blocks release
        if: ${{ failure() }}
        env:
          SLACK_WEBHOOK: ${{ secrets.SLACK_WEBHOOK }}
          FAILURE_DETAILS: ${{ steps.validate.outputs.failures || 'Image validation could not run. Check the failed setup, OIDC, or registry authentication step in the workflow logs.' }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          payload="$(jq -n --arg environment "$TARGET_ENVIRONMENT" --arg details "$FAILURE_DETAILS" --arg url "$RUN_URL" \
            '{text: ("<!here> " + ($environment | ascii_upcase) + " release blocked: image validation failed.\n" + $details + "\n<" + $url + "|View validation run>")}')"
          curl --fail-with-body --retry 3 -X POST -H 'Content-type: application/json' \
            --data "$payload" "$SLACK_WEBHOOK"
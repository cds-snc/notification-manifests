name: Production - Helmfile Apply

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "VERSION"

env:
  ACCOUNT_ID: ${{ secrets.PRODUCTION_AWS_ACCOUNT_ID }}
  AWS_DEFAULT_REGION: ca-central-1

permissions:
  id-token: write # This is required for requesting the OIDC JWT
  contents: write # This is required for actions/checkout
  pull-requests: write

jobs:
  pre-apply-snapshot:
    uses: ./.github/workflows/velero_snapshot.yaml
    with:
      environment: production
      backup_type: helm
    secrets: inherit

  helmfile-apply:
    needs: pre-apply-snapshot
    runs-on: ubuntu-latest
    outputs:
      BLAZER_DOCKER_TAG: ${{ steps.lambda-image-tags.outputs.BLAZER_DOCKER_TAG }}
      GOOGLE_CIDR_DOCKER_TAG: ${{ steps.lambda-image-tags.outputs.GOOGLE_CIDR_DOCKER_TAG }}
      HEARTBEAT_DOCKER_TAG: ${{ steps.lambda-image-tags.outputs.HEARTBEAT_DOCKER_TAG }}
      PINPOINT_TO_SQS_SMS_CALLBACKS_DOCKER_TAG: ${{ steps.lambda-image-tags.outputs.PINPOINT_TO_SQS_SMS_CALLBACKS_DOCKER_TAG }}
      SES_RECEIVING_EMAILS_DOCKER_TAG: ${{ steps.lambda-image-tags.outputs.SES_RECEIVING_EMAILS_DOCKER_TAG }}
      SES_TO_SQS_EMAIL_CALLBACKS_DOCKER_TAG: ${{ steps.lambda-image-tags.outputs.SES_TO_SQS_EMAIL_CALLBACKS_DOCKER_TAG }}
      SNS_TO_SQS_SMS_CALLBACKS_DOCKER_TAG: ${{ steps.lambda-image-tags.outputs.SNS_TO_SQS_SMS_CALLBACKS_DOCKER_TAG }}
      SYSTEM_STATUS_DOCKER_TAG: ${{ steps.lambda-image-tags.outputs.SYSTEM_STATUS_DOCKER_TAG }}
    steps:

      - name: Inject token authentication
        run: |
          git config --global url."https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/".insteadOf "https://github.com/"

      - name: Configure credentials to Notify using OIDC
        uses: aws-actions/configure-aws-credentials@ececac1a45f3b08a01d2dd070d28d111c5fe6722 # v4.1.0
        with:
          role-to-assume: arn:aws:iam::${{env.ACCOUNT_ID}}:role/notification-manifests-helmfile-production-apply
          role-session-name: NotifyManifestsApply
          aws-region: ${{ env.AWS_DEFAULT_REGION }}

      - name: Checkout
        uses: actions/checkout@f43a0e5ff2bd294095638e18286ca9a3d1956744 # v3.6.0
        with:
          # Fetches entire history, so we can analyze commits since last tag
          fetch-depth: 0

      - name: Setup helmfile
        uses: mamezou-tech/setup-helmfile@fd46979d2984c886929c416fbdf859b1c5efa0ea # v2.1.0
        with:
          install-kubectl: yes
          install-helm: yes       
          helmfile-version: "v1.4.4"
          helm-s3-plugin-version: "v0.16.2"

      - name: Setup Terraform tools
        uses: cds-snc/terraform-tools-setup@cc15ce9039f6c37c592fb9930b70466b229d2e9b # v1
        env: # In case you want to override default versions
          CONFTEST_VERSION: 0.30.0 
          TERRAFORM_VERSION: 1.9.5
          TERRAGRUNT_VERSION: 0.66.9
          TF_SUMMARIZE_VERSION: 0.2.3                           


      - name: Setup cluster access
        uses: ./.github/actions/setup-cluster-access
        with:
          environment: production
          aws-account-id: ${{ secrets.PRODUCTION_AWS_ACCOUNT_ID }}
          op-service-account-token: ${{ secrets.OP_SERVICE_ACCOUNT_TOKEN_PRODUCTION }}
          role-name: notification-manifests-helmfile-production-apply
          gha-vpn-id: ${{ secrets.GHA_VPN_ID_PRODUCTION }}
          gha-vpn-cert: ${{ secrets.GHA_VPN_CERT_PRODUCTION }}
          gha-vpn-key: ${{ secrets.GHA_VPN_KEY_PRODUCTION }}

      - name: Load Context Variables
        run: |
            ./helmfile/getContext.sh -g

      - name: Login to Amazon ECR Public
        run: |
          set -o pipefail
          aws ecr-public get-login-password --region us-east-1 | helm registry login --username AWS --password-stdin public.ecr.aws

      - name: Read Lambda image tags from production.env
        id: lambda-image-tags
        run: |
          for key in BLAZER_DOCKER_TAG GOOGLE_CIDR_DOCKER_TAG HEARTBEAT_DOCKER_TAG PINPOINT_TO_SQS_SMS_CALLBACKS_DOCKER_TAG SES_RECEIVING_EMAILS_DOCKER_TAG SES_TO_SQS_EMAIL_CALLBACKS_DOCKER_TAG SNS_TO_SQS_SMS_CALLBACKS_DOCKER_TAG SYSTEM_STATUS_DOCKER_TAG; do
            value="$(sed -n "s/^${key}:[[:space:]]*\"\([^\"]*\)\"/\1/p" helmfile/overrides/production.env)"
            test -n "$value"
            test "$value" != "latest"
            test "$value" != "bootstrap"
            echo "${key}=${value}" >> "$GITHUB_OUTPUT"
          done

      - name: Run Database Upgrade Helmfile Sync
        uses: ./.github/actions/db-migration
        with:
          environment: "production"
          namespace: "notification-canada-ca"
          app_label: "notify-database"
          timeout: "400s"

      - name: Helmfile apply
        if: ${{ success() }}
        id: helmfile_apply
        run: |
          pushd helmfile
          helmfile --environment production -l 'tier=crd' apply
          helmfile --environment production -l 'app!=notify-database,tier!=crd' apply
          popd

  lambda-deploy:
    needs: helmfile-apply
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        include:
          - function_name: heartbeat
            image: notify/heartbeat
            region: ca-central-1
            tag_key: HEARTBEAT_DOCKER_TAG
          - function_name: system_status
            image: notify/system_status
            region: ca-central-1
            tag_key: SYSTEM_STATUS_DOCKER_TAG
          - function_name: ses_to_sqs_email_callbacks
            image: notify/ses_to_sqs_email_callbacks
            region: ca-central-1
            tag_key: SES_TO_SQS_EMAIL_CALLBACKS_DOCKER_TAG
          - function_name: google-cidr
            image: lambda/google-cidr
            region: ca-central-1
            tag_key: GOOGLE_CIDR_DOCKER_TAG
          - function_name: sns_to_sqs_sms_callbacks
            image: notify/sns_to_sqs_sms_callbacks
            region: ca-central-1
            tag_key: SNS_TO_SQS_SMS_CALLBACKS_DOCKER_TAG
          - function_name: pinpoint_to_sqs_sms_callbacks
            image: notify/pinpoint_to_sqs_sms_callbacks
            region: ca-central-1
            tag_key: PINPOINT_TO_SQS_SMS_CALLBACKS_DOCKER_TAG
          - function_name: pinpoint_to_sqs_sms_callbacks_us_west_2
            image: notify/pinpoint_to_sqs_sms_callbacks
            region: us-west-2
            tag_key: PINPOINT_TO_SQS_SMS_CALLBACKS_DOCKER_TAG
          - function_name: ses_receiving_emails
            image: notify/ses_receiving_emails
            region: us-east-1
            tag_key: SES_RECEIVING_EMAILS_DOCKER_TAG
    steps:
      - name: Configure credentials to Notify using OIDC
        uses: aws-actions/configure-aws-credentials@ececac1a45f3b08a01d2dd070d28d111c5fe6722 # v4.1.0
        with:
          role-to-assume: arn:aws:iam::${{ env.ACCOUNT_ID }}:role/notification-manifests-helmfile-production-apply
          role-session-name: NotifyManifestsApply
          aws-region: ${{ matrix.region }}

      - name: Checkout
        uses: actions/checkout@f43a0e5ff2bd294095638e18286ca9a3d1956744 # v3.6.0

      - name: Update Lambda image and alias
        uses: ./.github/actions/update-lambda-function
        with:
          alias-name: latest
          function-name: ${{ matrix.function_name }}
          aws-region: ${{ matrix.region }}
          image-uri: "${{ env.ACCOUNT_ID }}.dkr.ecr.${{ matrix.region }}.amazonaws.com/${{ matrix.image }}:${{ needs.helmfile-apply.outputs[matrix.tag_key] }}"

  blazer-deploy:
    needs: helmfile-apply
    runs-on: ubuntu-latest
    steps:
      - name: Configure credentials to Notify using OIDC
        uses: aws-actions/configure-aws-credentials@ececac1a45f3b08a01d2dd070d28d111c5fe6722 # v4.1.0
        with:
          role-to-assume: arn:aws:iam::${{ env.ACCOUNT_ID }}:role/notification-manifests-helmfile-production-apply
          role-session-name: NotifyManifestsApply
          aws-region: ca-central-1

      - name: Update Blazer ECS service image
        env:
          BLAZER_IMAGE_URI: "${{ env.ACCOUNT_ID }}.dkr.ecr.ca-central-1.amazonaws.com/database-tools/blazer:${{ needs.helmfile-apply.outputs.BLAZER_DOCKER_TAG }}"
        run: |
          aws ecs describe-task-definition \
            --task-definition blazer \
            --include TAGS \
            --query taskDefinition \
            --output json > /tmp/blazer-task-definition.json

          jq --arg image "$BLAZER_IMAGE_URI" '
            .containerDefinitions |= map(
              if .name == "blazer" then .image = $image else . end
            )
            | del(.taskDefinitionArn, .revision, .status, .requiresAttributes, .compatibilities, .registeredAt, .registeredBy, .deregisteredAt)
          ' /tmp/blazer-task-definition.json > /tmp/blazer-task-definition-register.json

          task_definition_arn="$(aws ecs register-task-definition \
            --cli-input-json file:///tmp/blazer-task-definition-register.json \
            --query 'taskDefinition.taskDefinitionArn' \
            --output text)"

          aws ecs update-service \
            --cluster blazer \
            --service blazer \
            --task-definition "$task_definition_arn" >/dev/null
          aws ecs wait services-stable --cluster blazer --services blazer

  notify-slack:
    needs: [helmfile-apply, lambda-deploy, blazer-deploy]
    if: ${{ failure() }}
    runs-on: ubuntu-latest
    steps:
      - name: Notify Slack channel if production apply failed
        run: |
          json='{"text":"<!here> Production Helmfile Apply is Failing <https://github.com/cds-snc/notification-manifests/|notification-manifests> !"}'
          curl --fail -X POST -H 'Content-type: application/json' --data "$json" "${{ secrets.SLACK_WEBHOOK }}"

  clear-cache:
    needs: [lambda-deploy, blazer-deploy]
    uses: ./.github/workflows/clear-notify-cache.yaml
    with:
      environment: production
      cache_clear_user_name: CACHE_CLEAR_USER
      api_url: https://api.notification.canada.ca
    secrets:
      CACHE_CLEAR_CLIENT_SECRET: ${{ secrets.PRODUCTION_CACHE_CLEAR_CLIENT_SECRET }}
        

  publish-deployment:
    runs-on: ubuntu-latest
    needs: [lambda-deploy, blazer-deploy]

    steps:
      
      - name: Report deployment to Sentinel
        uses: cds-snc/sentinel-forward-data-action@765ac36a34b70d87ae77f228c48025a4331b6275 # main@2026-08-13
        with:
          input_data: '{"product": "notify", "sha": "${{ github.sha }}", "version": "${{ env.TARGET_VERSION }}", "repository": "${{ github.repository }}", "environment": "production"}'
          log_type: CDS_Product_Deployment_Data
          log_analytics_workspace_id: ${{ secrets.LOG_ANALYTICS_WORKSPACE_ID }}
          log_analytics_workspace_key: ${{ secrets.LOG_ANALYTICS_WORKSPACE_KEY }}


      - name: Notify Slack channel if this job failed
        if: ${{ failure() }}
        run: |
          json='{"text":"<!here> CI is failing in <https://github.com/cds-snc/notification-manifests/|notification-manifests> !"}'
          curl -X POST -H 'Content-type: application/json' --data "$json"  ${{ secrets.SLACK_WEBHOOK }}

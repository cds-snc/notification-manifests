name: Promote staged IPv4 image

on:
  workflow_run:
    workflows: ["Staging - Helmfile Apply"]
    types: [completed]
    branches: [main]

permissions:
  contents: read

concurrency:
  group: promote-ipv4-image
  cancel-in-progress: false

jobs:
  promote:
    if: github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - name: Obtain a Notify PR Bot GitHub App Installation Access Token
        id: bot-token
        env:
          PR_BOT_GITHUB_TOKEN: ${{ secrets.PR_BOT_GITHUB_TOKEN }}
        run: |
          TOKEN="$(npx obtain-github-app-installation-access-token@1.1.0 ci "$PR_BOT_GITHUB_TOKEN")"
          echo "::add-mask::$TOKEN"
          echo "token=$TOKEN" >> "$GITHUB_OUTPUT"

      - name: Propose the exact staging image for production
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8.0.0
        with:
          github-token: ${{ steps.bot-token.outputs.token }}
          script: |
            const { owner, repo } = context.repo;
            const run = context.payload.workflow_run;
            const branch = "release/ipv4-geolocate";
            const stagingPath = "helmfile/overrides/staging.env";
            const productionPath = "helmfile/overrides/production.env";
            const { data: main } = await github.rest.repos.getBranch({ owner, repo, branch: "main" });
            const read = async (path, ref) => {
              const { data } = await github.rest.repos.getContent({ owner, repo, path, ref });
              return Buffer.from(data.content, "base64").toString("utf8");
            };
            const imageTag = content => content.match(/^IPV4_DOCKER_TAG: "([^"]+)"$/m)?.[1];
            const stagedTag = imageTag(await read(stagingPath, run.head_sha));
            if (!/^[0-9a-f]{7}-\d{8}T\d{6}Z-\d+-\d+$/.test(stagedTag || "")) {
              core.info("No published IPv4 SHA/date tag to promote.");
              return;
            }
            if (imageTag(await read(stagingPath, main.commit.sha)) !== stagedTag) {
              core.info("Staging configuration has advanced; wait for its successful deployment.");
              return;
            }
            const production = await read(productionPath, main.commit.sha);
            const productionTag = imageTag(production);
            if (!productionTag) throw new Error("Missing IPV4_DOCKER_TAG in production.env");
            if (productionTag === stagedTag) {
              core.info("Production already tracks the staged IPv4 image.");
              return;
            }
            const contents = production.replace(/^IPV4_DOCKER_TAG: "[^"]+"$/m, `IPV4_DOCKER_TAG: "${stagedTag}"`);
            const ref = `heads/${branch}`;
            try {
              await github.rest.git.getRef({ owner, repo, ref });
              await github.rest.git.updateRef({ owner, repo, ref, sha: main.commit.sha, force: true });
            } catch (error) {
              if (error.status !== 404) throw error;
              await github.rest.git.createRef({ owner, repo, ref: `refs/${ref}`, sha: main.commit.sha });
            }
            await github.graphql(`mutation($input: CreateCommitOnBranchInput!) {
              createCommitOnBranch(input: $input) { commit { oid } }
            }`, {
              input: {
                branch: { repositoryNameWithOwner: `${owner}/${repo}`, branchName: branch },
                expectedHeadOid: main.commit.sha,
                message: { headline: `Promote IPv4 image ${stagedTag}` },
                fileChanges: { additions: [{ path: productionPath, contents: Buffer.from(contents).toString("base64") }] }
              }
            });
            const title = "[MANIFEST] Promote staged IPv4 image";
            const body = `Promote the exact IPv4 image validated in staging: \`${stagedTag}\`.\n\nSuccessful staging deployment: ${run.html_url}\n\nNo image rebuild. Merging uses the existing manifests release and production Helm workflows.`;
            const { data: pulls } = await github.rest.pulls.list({ owner, repo, head: `${owner}:${branch}`, base: "main", state: "open" });
            if (pulls.length) {
              await github.rest.pulls.update({ owner, repo, pull_number: pulls[0].number, title, body });
            } else {
              await github.rest.pulls.create({ owner, repo, head: branch, base: "main", title, body });
            }
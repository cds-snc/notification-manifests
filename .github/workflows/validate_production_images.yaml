name: Validate production release images

on:
  workflow_call:
    inputs:
      role-name:
        description: Existing deployment or diff role used for read-only registry checks
        required: true
        type: string
    secrets:
      PRODUCTION_AWS_ACCOUNT_ID:
        required: true
      SLACK_WEBHOOK:
        required: true

permissions:
  contents: read
  id-token: write

env:
  NODE_OPTIONS: --use-openssl-ca
  SSL_CERT_FILE: /etc/ssl/certs/ca-certificates.crt
  SSL_CERT_DIR: /etc/ssl/certs

jobs:
  validate-images:
    runs-on: ubuntu-latest
    steps:
      - name: Prepare Ubuntu CA trust
        uses: route06/actions/prepare-ubuntu-ca@aa6b218e4bc5445f54d3649a04297af5e1ce7458 # temporary CA mitigation

      - name: Checkout release configuration
        uses: actions/checkout@f43a0e5ff2bd294095638e18286ca9a3d1956744 # v3.6.0

      - name: Configure production ECR credentials using OIDC
        uses: aws-actions/configure-aws-credentials@ececac1a45f3b08a01d2dd070d28d111c5fe6722 # v4.1.0
        with:
          role-to-assume: arn:aws:iam::${{ secrets.PRODUCTION_AWS_ACCOUNT_ID }}:role/${{ inputs.role-name }}
          role-session-name: NotifyReleaseImageValidation
          aws-region: ca-central-1

      - name: Authenticate to public ECR
        run: |
          set -o pipefail
          aws ecr-public get-login-password --region us-east-1 |
            docker login --username AWS --password-stdin public.ecr.aws

      - name: Validate release revisions and images
        id: validate
        uses: ./.github/actions/validate-release-images
        with:
          aws-account-id: ${{ secrets.PRODUCTION_AWS_ACCOUNT_ID }}

      - name: Notify Slack when image validation blocks release
        if: ${{ failure() }}
        env:
          SLACK_WEBHOOK: ${{ secrets.SLACK_WEBHOOK }}
          FAILURE_DETAILS: ${{ steps.validate.outputs.failures || 'Image validation could not run. Check the failed setup, OIDC, or registry authentication step in the workflow logs.' }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          payload="$(jq -n --arg details "$FAILURE_DETAILS" --arg url "$RUN_URL" \
            '{text: ("<!here> Production release blocked: image validation failed.\n" + $details + "\n<" + $url + "|View validation run>")}')"
          curl --fail-with-body --retry 3 -X POST -H 'Content-type: application/json' \
            --data "$payload" "$SLACK_WEBHOOK"
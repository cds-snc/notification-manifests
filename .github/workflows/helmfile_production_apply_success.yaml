name: Helmfile Production Apply Success

on:
  workflow_run:
    workflows:
      - "Production - Helmfile Apply"
    types:
      - completed

permissions: {}

env: # temporary CA mitigation
  NODE_OPTIONS: --use-openssl-ca
  SSL_CERT_FILE: /etc/ssl/certs/ca-certificates.crt
  SSL_CERT_DIR: /etc/ssl/certs

jobs:
  notify-on-success:
    runs-on: ubuntu-latest
    if: github.event.workflow_run.conclusion == 'success'
    steps:
      - name: Prepare Ubuntu CA trust
        uses: route06/actions/prepare-ubuntu-ca@aa6b218e4bc5445f54d3649a04297af5e1ce7458 # temporary CA mitigation
      - name: Notify Slack on Success
        run: |
          json='{"blocks":[{"type":"section","text":{"type":"mrkdwn","text":":white_check_mark: Manifests release complete ✅ <${{ github.event.workflow_run.html_url }}|${{ github.event.workflow_run.name }}>"}}]}'
          curl -X POST -H 'Content-type: application/json' --data "$json" ${{ secrets.SLACK_WEBHOOK }}

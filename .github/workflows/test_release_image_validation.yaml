name: Test release image validation

on:
  pull_request:
    paths:
      - '.github/actions/validate-release-images/**'
      - '.github/workflows/*production*'
      - '.github/workflows/test_release_image_validation.yaml'
  push:
    branches: [main]
    paths:
      - '.github/actions/validate-release-images/**'
      - '.github/workflows/*production*'
      - '.github/workflows/test_release_image_validation.yaml'

permissions:
  contents: read

env:
  NODE_OPTIONS: --use-openssl-ca
  SSL_CERT_FILE: /etc/ssl/certs/ca-certificates.crt
  SSL_CERT_DIR: /etc/ssl/certs

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Prepare Ubuntu CA trust
        uses: route06/actions/prepare-ubuntu-ca@aa6b218e4bc5445f54d3649a04297af5e1ce7458 # temporary CA mitigation
      - name: Checkout
        uses: actions/checkout@f43a0e5ff2bd294095638e18286ca9a3d1956744 # v3.6.0
      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24.22.1'
      - name: Test release validation and deployment gates
        working-directory: .github/actions/validate-release-images
        run: |
          npm ci --ignore-scripts
          npm test
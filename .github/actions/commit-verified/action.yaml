name: Commit verified
description: Creates a GitHub-verified (signed) commit on a branch via the GraphQL API, bypassing local git commit/push
inputs:
  github-token:
    description: Token with contents:write permission on the repo
    required: true
  branch:
    description: Branch to commit to
    required: true
    default: main
  commit-message:
    description: Commit message headline
    required: true
  files:
    description: Newline-separated list of file paths (relative to repo root) to include as additions in the commit
    required: true
runs:
  using: composite
  steps:
    - name: Create commit via GitHub API
      uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8.0.0
      env:
        COMMIT_BRANCH: ${{ inputs.branch }}
        COMMIT_MESSAGE: ${{ inputs.commit-message }}
        COMMIT_FILES: ${{ inputs.files }}
      with:
        github-token: ${{ inputs.github-token }}
        script: |
          const fs = require("fs");

          const [owner, repo] = process.env.GITHUB_REPOSITORY.split("/");
          const branch = process.env.COMMIT_BRANCH;
          const filePaths = process.env.COMMIT_FILES.split("\n").map(f => f.trim()).filter(Boolean);

          const { repository } = await github.graphql(
            `query($owner: String!, $repo: String!, $qualifiedName: String!) {
              repository(owner: $owner, name: $repo) {
                ref(qualifiedName: $qualifiedName) {
                  target { ... on Commit { oid } }
                }
              }
            }`,
            { owner, repo, qualifiedName: `refs/heads/${branch}` }
          );
          const expectedHeadOid = repository.ref.target.oid;

          const additions = filePaths.map(filePath => ({
            path: filePath,
            contents: fs.readFileSync(filePath).toString("base64"),
          }));

          await github.graphql(
            `mutation($input: CreateCommitOnBranchInput!) {
              createCommitOnBranch(input: $input) {
                commit { oid url }
              }
            }`,
            {
              input: {
                branch: {
                  repositoryNameWithOwner: `${owner}/${repo}`,
                  branchName: branch,
                },
                message: { headline: process.env.COMMIT_MESSAGE },
                expectedHeadOid,
                fileChanges: { additions },
              },
            }
          );

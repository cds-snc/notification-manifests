name: "Helmfile Apply with Retry"
description: "Run helmfile apply and retry transient failures."
inputs:
  environment:
    description: "The Helmfile environment to use (e.g., staging)."
    required: true
  selector:
    description: "The Helmfile selector passed to -l."
    required: true
  attempts:
    description: "How many times to try the helmfile apply command."
    required: false
    default: "3"
  delay_seconds:
    description: "How long to wait between retries."
    required: false
    default: "30"

runs:
  using: "composite"
  steps:
    - name: Helmfile Apply
      shell: bash
      env:
        HELMFILE_ENVIRONMENT: ${{ inputs.environment }}
        HELMFILE_SELECTOR: ${{ inputs.selector }}
        RETRY_ATTEMPTS: ${{ inputs.attempts }}
        RETRY_DELAY_SECONDS: ${{ inputs.delay_seconds }}
      run: |
        pushd helmfile

        attempt=1
        while true; do
          log_file=$(mktemp)
          set +e
          helmfile --environment "$HELMFILE_ENVIRONMENT" -l "$HELMFILE_SELECTOR" apply 2>&1 | tee "$log_file"
          status=${PIPESTATUS[0]}
          set -e

          if [ "$status" -eq 0 ]; then
            rm -f "$log_file"
            break
          fi

          if ! grep -Eiq 'failed to .*fetch .*((504 )?gateway timeout|tls handshake timeout|connection reset by peer|i/o timeout)' "$log_file"; then
            rm -f "$log_file"
            popd
            exit "$status"
          fi

          if [ "$attempt" -ge "$RETRY_ATTEMPTS" ]; then
            rm -f "$log_file"
            popd
            exit "$status"
          fi

          attempt=$((attempt + 1))
          echo "Helmfile command failed, retrying in ${RETRY_DELAY_SECONDS} seconds (attempt ${attempt}/${RETRY_ATTEMPTS})..."
          sleep "$RETRY_DELAY_SECONDS"
          rm -f "$log_file"
        done

        popd

apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata:
  name: {{ include "signoz-report.fullname" . }}
  labels:
    {{- include "signoz-report.labels" . | nindent 4 }}
spec:
  provider: aws
  parameters:
    objects: |
    {{- range $key, $name := .Values.secrets }}
      - objectName: {{ $name }}
        objectType: "secretsmanager"
    {{- end }}

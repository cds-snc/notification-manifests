{{- if .Values.secretProviderClass.enabled }}
apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata:
  name: {{ include "jobs.fullname" . }}
  labels:
    {{- include "jobs.labels" . | nindent 4 }}
spec:
  provider: {{ .Values.secretProviderClass.provider }}
  parameters:
    objects: |
    {{- range $key, $val := .Values.apiSecrets }}
      - objectName: {{ $val }}
        objectType: "secretsmanager"
    {{- end }}
  secretObjects:
    - data:
      {{- range $key, $val := .Values.apiSecrets }}
      - key: {{ $key }}
        objectName: {{ $val }}
      {{- end }}
      secretName: {{ .Values.secretProviderClass.secretname }}
      type: generic
{{- else if .Values.apiSecrets }}
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: {{ include "jobs.fullname" . }}
  labels:
    {{- include "jobs.labels" . | nindent 4 }}
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: aws-secrets-manager
    kind: ClusterSecretStore
  target:
    name: {{ .Values.secretProviderClass.secretname }}
    creationPolicy: Owner
  data:
    {{- range $key, $val := .Values.apiSecrets }}
    - secretKey: {{ $key }}
      remoteRef:
        key: {{ $val }}
    {{- end }}
{{- end }}

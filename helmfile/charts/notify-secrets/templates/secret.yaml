{{- if .Values.clusterSecretStore.enabled }}
# Cluster-scoped singleton: only one release in the whole cluster should own this.
apiVersion: external-secrets.io/v1beta1
kind: ClusterSecretStore
metadata:
  name: aws-secrets-manager
spec:
  provider:
    aws:
      service: SecretsManager
      region: {{ .Values.region }}
      # No role: IRSA on the serviceAccountRef already grants the right role; a second
      # AssumeRole hop onto the same role fails since its trust policy only allows
      # AssumeRoleWithWebIdentity.
      auth:
        jwt:
          serviceAccountRef:
            name: {{ .Values.serviceAccountRef.name }}
            namespace: {{ .Values.serviceAccountRef.namespace }}
{{- end }}
{{- if .Values.externalSecret.enabled }}
---
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: {{ .Values.externalSecret.secretname }}
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: aws-secrets-manager
    kind: ClusterSecretStore
  target:
    name: {{ .Values.externalSecret.secretname }}
    creationPolicy: Owner
  data:
    {{- range $key, $val := .Values.externalSecret.secrets }}
    - secretKey: {{ $key }}
      remoteRef:
        key: {{ $val }}
    {{- end }}
{{- end }}

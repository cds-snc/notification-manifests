database:
  args: "upgrade"

image:
  repository: public.ecr.aws/cds-snc/notify-api
  pullPolicy: Always
  # Overrides the image tag whose default is the chart appVersion.
  tag: "latest"

ttlSecondsAfterFinished: 34560

service:
  enabled: true
  annotations: {}
  type: ClusterIP
  port: 80

serviceAccount:
  create: true
  serviceAccountName: "notify-database"

# Run on the always-warm EKS managed on-demand node group instead of a Karpenter
# spot node: a new spot node can take 5+ minutes to provision and become
# schedulable (spot capacity fulfillment + node bootstrap + nidhogg startup
# taints), which blocks this job and any deploy waiting on it.
nodeSelector:
  eks.amazonaws.com/capacityType: ON_DEMAND

tolerations: []

secretProviderClass:
  secretname: notify-database
  enabled: true
  provider: aws
  parameters:
    objects: |
      - objectName: INTERNAL_DNS_KEY_BASE64
        objectType: "secretsmanager"
      - objectName: INTERNAL_DNS_CERT_BASE64
        objectType: "secretsmanager"

  secretObjects:
    - data:
        - key: tls.key
          objectName: INTERNAL_DNS_KEY_BASE64
        - key: tls.crt
          objectName: INTERNAL_DNS_CERT_BASE64
      secretName: nginx
      type: kubernetes.io/tls
